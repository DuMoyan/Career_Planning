services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: career, POSTGRES_USER: career, POSTGRES_PASSWORD: career }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U career"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://career:career@postgres/career
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-at-least-32-chars}
      UPLOAD_DIR: /app/uploads
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes: [uploads:/app/uploads]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes: { postgres-data: {}, uploads: {} }
